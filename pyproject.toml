[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-cost-wealth-playbook-tool"
version = "1.0.0"
description = "Open-source personal wealth acceleration toolkit with trackers, scripts, and guides using free tools. Zero cost optimizations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric", email = "eric847b@users.noreply.github.com" }]
keywords = ["wealth", "tracker", "runway", "zero-cost", "personal-finance", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []  # stdlib only

[project.urls]
Homepage = "https://github.com/eric847b/zero-cost-wealth-playbook-tool"
Repository = "https://github.com/eric847b/zero-cost-wealth-playbook-tool"
Issues = "https://github.com/eric847b/zero-cost-wealth-playbook-tool/issues"

[project.scripts]
wealth-tracker = "tracker:main"
wealth-runway = "runway:main"
wealth-export = "export:main"

[tool.setuptools]
py-modules = ["tracker", "runway", "export"]
